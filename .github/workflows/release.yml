# 构建 Android APK 与 Windows 安装包，并发布 GitHub Release（测试版）。
#
# 版本号来自 pubspec.yaml 的 `version:`。当这个版本还没有对应的 Release（标签 v<版本>）时，
# 自动创建预发布 Release，并上传：
#   Viora-<版本>-android-arm64-v8a.apk  Android / Android TV（64 位，应用内更新优先用按架构拆分的包）
#   Viora-<版本>-android-armeabi-v7a.apk Android / Android TV（32 位，多数电视盒子）
#   Viora-<版本>-android.apk            通用包（所有架构，体积大；旧版本应用内更新用它）
#   Viora-<版本>-windows-setup.exe      Windows 安装包（应用内更新使用）
#   Viora-<版本>-windows-portable.zip   Windows 免安装版
#   latest.json                        自建更新源可直接使用的清单
# 版本号没变时只构建，产物在 Actions 页面的 Artifacts 里下载。
#
# 只有 main 分支会触发：开发分支先合并到 main 再发布（手动运行时也只在 main 上创建 Release）。
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          version=${full%%+*}
          build=${full#*+}
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "版本 $full，标签 $tag，已发布：$exists" >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Viora-${{ needs.prepare.outputs.version }}-android.apk"
      # 按架构拆分（versionCode 会加上架构偏移：v7a +1000、arm64 +2000，从通用包升级上来不受影响）
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
      - run: |
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/Viora-${{ needs.prepare.outputs.version }}-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
      - name: 打包安装程序与免安装版
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $release = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\$release" "/DOutputDir=$PWD\dist" windows\installer\viora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Viora-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, android, windows]
    if: needs.prepare.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成更新说明与 latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "测试版，仅供测试。"
            echo
            echo "### 更新内容"
            git log $range --no-merges --pretty='- %s' -n 30
          } > notes.md
          asset() {
            f="dist/$1"
            printf '{"url":"%s/%s","sha256":"%s","size":%s}' "$base" "$1" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")"
          }
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson android "$(asset "Viora-$VERSION-android.apk")" \
            --argjson arm64 "$(asset "Viora-$VERSION-android-arm64-v8a.apk")" \
            --argjson armv7 "$(asset "Viora-$VERSION-android-armeabi-v7a.apk")" \
            --argjson windows "$(asset "Viora-$VERSION-windows-setup.exe")" \
            '{version: $version, notes: $notes, published_at: $published, assets: {android: $android, "android-arm64-v8a": $arm64, "android-armeabi-v7a": $armv7, windows: $windows}}' \
            > dist/latest.json
          cat dist/latest.json
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # 拆分包最后上传：旧版本客户端取第一个 .apk，要让它先看到通用包
        run: |
          first=$(ls dist/* | grep -v -- '-android-.*\.apk$')
          gh release create "$TAG" $first \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Viora v$VERSION（测试版）" \
            --notes-file notes.md \
            --prerelease
          gh release upload "$TAG" dist/*-android-*.apk --repo "$GITHUB_REPOSITORY"
