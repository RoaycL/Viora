# 构建 Android APK 与 Windows 安装包，并发布 GitHub Release（正式版或测试版）。
#
# 版本号来自 pubspec.yaml 的 `version:`，发正式版还是测试版看仓库根目录的 `release-channel` 文件：
#   stable → 标签 v<版本>，正式版（GitHub 上标为 Latest）
#   betaN  → 标签 beta-v<版本>-betaN（如 beta-v0.17.6-beta1），测试版（预发布）。测试版不单独占版本号：
#            pubspec 里写下一个正式版的版本号，同一个版本号下按 beta1、beta2… 发，最后发正式版
#            （release-channel 改回 stable）。应用里打包时注入 VIORA_PRERELEASE=betaN，显示为 0.17.6-beta1，
#            比较新旧时 beta1 < beta2 < 正式版；按「设置 → 检查测试版」决定要不要提示测试版
#   标签保留 beta- 前缀：v0.15.33 及以前的应用不区分预发布，前缀让它们解析不了测试版标签，只会更新到正式版。
#   v0.17.5 及以前的测试版是 beta-v<版本>（每个测试版占一个版本号），应用仍能识别
# 每个标签只发一次；正式版发过之后不能再发这个版本号的测试版。当这个标签还没有发布时，创建 Release 并上传：
#   Viora-<版本>-android.split-arm64-v8a.apk   Android / Android TV（64 位，应用内更新优先用按架构拆分的包）
#   Viora-<版本>-android.split-armeabi-v7a.apk Android / Android TV（32 位，多数电视盒子）
#   Viora-<版本>-android.apk            通用包（所有架构，体积大；旧版本应用内更新用它）
#   Viora-<版本>-windows-setup.exe      Windows 安装包（应用内更新使用）
#   Viora-<版本>-windows-portable.zip   Windows 免安装版
#   latest.json                        自建更新源可直接使用的清单（带 prerelease 标记）
# 版本号没变时只构建，产物在 Actions 页面的 Artifacts 里下载。
#
# 只有 main 分支会触发：开发分支先合并到 main 再发布（手动运行时也只在 main 上创建 Release）。
# 发布不会被后面的推送取消（排队执行）：取消在上传中途会留下缺文件的 Release，而重跑时标签已存在会跳过发布。
# Release 先建成草稿、所有文件传完再公开，中途失败也不会出现残缺的发布。
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      display: ${{ steps.v.outputs.display }}
      pre: ${{ steps.v.outputs.pre }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
      beta: ${{ steps.v.outputs.beta }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          version=${full%%+*}
          build=${full#*+}
          channel=$(tr -d '[:space:]' < release-channel 2>/dev/null || echo stable)
          case "$channel" in
            stable) beta=false; pre=""; display="$version"; tag="v$version" ;;
            beta[1-9]|beta[1-9][0-9]) beta=true; pre="$channel"; display="$version-$channel"; tag="beta-v$display" ;;
            *) echo "release-channel 只能是 stable 或 beta1、beta2…：$channel"; exit 1 ;;
          esac
          # 这个标签发过就不再发；正式版（或旧规则下同版本号的测试版 beta-v<版本>）发过之后，也不再发这个版本号的测试版
          exists=false
          for t in "$tag" "beta-v$version" $([ "$beta" = true ] && echo "v$version"); do
            # 上次中途失败留下的草稿不算已发布（发布步骤会先删掉它）
            draft=$(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$draft" = false ]; then exists=true; fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "display=$display" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          echo "版本 $display（$full），标签 $tag（$([ "$beta" = true ] && echo 测试版 || echo 正式版)），已发布：$exists" >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # MiSans 只在 Windows 上做界面字体（约 22MB），安卓包里去掉：删掉 pubspec 里的字体声明和字体文件
      - name: Drop Windows-only font
        run: |
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          # 现在 fonts 下只有 MiSans：整段去掉（含注释和每个字重）
          s, n = re.subn(r"\n  fonts:\n(?:(?:    |      |        |          ).*\n)+", "\n", s)
          assert n == 1 and 'MiSans' not in s, 'unexpected fonts block'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          rm -f assets/fonts/MiSans-*.ttf
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }} --dart-define=VIORA_OPENSUBTITLES_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=VIORA_DANDANPLAY_APP_ID=${{ secrets.DANDANPLAY_APP_ID }} --dart-define=VIORA_DANDANPLAY_APP_SECRET=${{ secrets.DANDANPLAY_APP_SECRET }} --dart-define=VIORA_PRERELEASE=${{ needs.prepare.outputs.pre }}
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Viora-${{ needs.prepare.outputs.display }}-android.apk"
      # 按架构拆分（versionCode 会加上架构偏移：v7a +1000、arm64 +2000，从通用包升级上来不受影响）
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }} --dart-define=VIORA_OPENSUBTITLES_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=VIORA_DANDANPLAY_APP_ID=${{ secrets.DANDANPLAY_APP_ID }} --dart-define=VIORA_DANDANPLAY_APP_SECRET=${{ secrets.DANDANPLAY_APP_SECRET }} --dart-define=VIORA_PRERELEASE=${{ needs.prepare.outputs.pre }}
      - run: |
          for abi in arm64-v8a armeabi-v7a; do
            # GitHub 接口按文件名排序列出安装包，旧版本应用内更新取第一个 .apk：
            # 「android.split-」排在「android.apk」后面，旧版本拿到的是通用包（32 位电视也能装）
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/Viora-${{ needs.prepare.outputs.display }}-android.split-$abi.apk"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }} --dart-define=VIORA_OPENSUBTITLES_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=VIORA_DANDANPLAY_APP_ID=${{ secrets.DANDANPLAY_APP_ID }} --dart-define=VIORA_DANDANPLAY_APP_SECRET=${{ secrets.DANDANPLAY_APP_SECRET }} --dart-define=VIORA_PRERELEASE=${{ needs.prepare.outputs.pre }}
      - name: 打包安装程序与免安装版
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.display }}"
          $release = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\$release" "/DOutputDir=$PWD\dist" windows\installer\viora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Viora-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, android, windows]
    if: needs.prepare.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: 生成更新说明与 latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.display }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # 更新内容：从上一个发布（正式版和测试版都算）到现在
          prev=$(git tag --list 'v*' 'beta-v*' --sort=-creatordate | head -n1)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            if [ "$BETA" = true ]; then echo "测试版，可能不稳定。应用里打开「设置 → 检查测试版」才会提示更新到测试版。"; else echo "正式版。"; fi
            echo
            echo "### 更新内容"
            git log $range --no-merges --pretty='- %s' -n 30
          } > notes.md
          asset() {
            f="dist/$1"
            printf '{"url":"%s/%s","sha256":"%s","size":%s}' "$base" "$1" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")"
          }
          jq -n \
            --arg version "$VERSION" \
            --argjson prerelease "$BETA" \
            --rawfile notes notes.md \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson android "$(asset "Viora-$VERSION-android.apk")" \
            --argjson arm64 "$(asset "Viora-$VERSION-android.split-arm64-v8a.apk")" \
            --argjson armv7 "$(asset "Viora-$VERSION-android.split-armeabi-v7a.apk")" \
            --argjson windows "$(asset "Viora-$VERSION-windows-setup.exe")" \
            '{version: $version, prerelease: $prerelease, notes: $notes, published_at: $published, assets: {android: $android, "android-arm64-v8a": $arm64, "android-armeabi-v7a": $armv7, windows: $windows}}' \
            > dist/latest.json
          cat dist/latest.json
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.display }}
          BETA: ${{ needs.prepare.outputs.beta }}
        # 拆分包最后上传（文件名也保证按名字排序时通用包在前，见上面 android 任务）
        run: |
          first=$(ls dist/* | grep -v -- '-android\.split-.*\.apk$')
          if [ "$BETA" = true ]; then
            kind=(--title "Viora v$VERSION（测试版）" --prerelease)
          else
            kind=(--title "Viora v$VERSION" --latest)
          fi
          # 上次中途失败留下的同名草稿：删掉重来
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # 先建草稿（用户看不到，也不会被当成已发布），文件全部传完再公开
          gh release create "$TAG" $first \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            --draft \
            "${kind[@]}"
          gh release upload "$TAG" dist/*-android.split-*.apk --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
