# 构建 Android APK 与 Windows 安装包，并发布 GitHub Release（测试版）。
#
# 版本号来自 pubspec.yaml 的 `version:`。当这个版本还没有对应的 Release（标签 v<版本>）时，
# 自动创建预发布 Release，并上传：
#   Viora-<版本>-android.apk            Android / Android TV
#   Viora-<版本>-windows-setup.exe      Windows 安装包（应用内更新使用）
#   Viora-<版本>-windows-portable.zip   Windows 免安装版
#   latest.json                        自建更新源可直接使用的清单
# 版本号没变时只构建，产物在 Actions 页面的 Artifacts 里下载。
#
# 只有 main 分支会触发：开发分支先合并到 main 再发布（手动运行时也只在 main 上创建 Release）。
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          version=${full%%+*}
          build=${full#*+}
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "版本 $full，标签 $tag，已发布：$exists" >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: 验证 TV 性能对照模式
        run: flutter test --dart-define=VIORA_TV_PERF_BASELINE=true test/tv_home_performance_test.dart

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Viora-${{ needs.prepare.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
      - name: 构建 TV 性能测量 APK（Profile）
        run: |
          flutter build apk --profile --dart-define=VIORA_FRAME_STATS=true --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
          mkdir -p profile-dist
          cp build/app/outputs/flutter-apk/app-profile.apk "profile-dist/Viora-${{ needs.prepare.outputs.version }}-android-profile.apk"
          flutter build apk --profile --dart-define=VIORA_FRAME_STATS=true --dart-define=VIORA_TV_PERF_BASELINE=true --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
          cp build/app/outputs/flutter-apk/app-profile.apk "profile-dist/Viora-${{ needs.prepare.outputs.version }}-android-profile-baseline.apk"
      - name: 验证正式包与测量包签名一致
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"
          certificate() {
            "$apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          release_cert=$(certificate "dist/Viora-${{ needs.prepare.outputs.version }}-android.apk")
          test -n "$release_cert"
          for apk in profile-dist/*.apk; do
            profile_cert=$(certificate "$apk")
            if [ "$profile_cert" != "$release_cert" ]; then
              echo "::error::测量包与正式包签名不一致：$apk"
              exit 1
            fi
            echo "签名验证通过：$(basename "$apk")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-tv-performance
          path: profile-dist/*
          if-no-files-found: error

  windows:
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=VIORA_TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}
      - name: 打包安装程序与免安装版
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $release = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\$release" "/DOutputDir=$PWD\dist" windows\installer\viora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Viora-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, android, windows]
    if: needs.prepare.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: '{android,windows}'
      - name: 生成更新说明与 latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "测试版，仅供测试。"
            echo
            echo "### 更新内容"
            git log $range --no-merges --pretty='- %s' -n 30
          } > notes.md
          asset() {
            f="dist/$1"
            printf '{"url":"%s/%s","sha256":"%s","size":%s}' "$base" "$1" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")"
          }
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson android "$(asset "Viora-$VERSION-android.apk")" \
            --argjson windows "$(asset "Viora-$VERSION-windows-setup.exe")" \
            '{version: $version, notes: $notes, published_at: $published, assets: {android: $android, windows: $windows}}' \
            > dist/latest.json
          cat dist/latest.json
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Viora v$VERSION（测试版）" \
            --notes-file notes.md \
            --prerelease
