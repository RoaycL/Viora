<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3D"/><stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.58" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4FA8FF" stop-opacity="0.28"/><stop offset="1" stop-color="#4FA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FE8FF"/><stop offset="1" stop-color="#3D73FF"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B98AFF"/><stop offset="1" stop-color="#6A3CFF"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9BD0"/><stop offset="1" stop-color="#FF5C86"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <!-- 大圆角播放三角：多边形 + 同色粗描边圆角连接 -->
    <polygon id="tri" points="400,330 400,694 690,512"/>
  </defs>
  <rect width="1024" height="1024" rx="236" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="236" fill="url(#glow)"/>
  <g opacity="0.55" transform="translate(-118 0) translate(512 512) scale(0.8) translate(-512 -512)">
    <use href="#tri" fill="url(#c3)" stroke="url(#c3)" stroke-width="150" stroke-linejoin="round"/>
  </g>
  <g opacity="0.72" transform="translate(-38 0) translate(512 512) scale(0.9) translate(-512 -512)">
    <use href="#tri" fill="url(#c2)" stroke="url(#c2)" stroke-width="150" stroke-linejoin="round"/>
  </g>
  <g transform="translate(66 0)">
    <use href="#tri" fill="url(#c1)" stroke="url(#c1)" stroke-width="150" stroke-linejoin="round"/>
  </g>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="235" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
</svg>
